# Процесс gh-dojo: задачи ведутся только через `gh dojo`.
# Ready — сделано, проверено и закоммичено в main; Done — вошло в релиз
# (done из пресета заодно закрывает issue как completed).

version = 1
preset = "kanban"

[board]
owner = "Trum-ok"
project = 5
repos = ["Trum-ok/gh-dojo"]

[labels]
types = ["bug", "enhancement", "documentation", "dogfood"]

[session]
env = ["CLAUDE_CODE_HOST_SESSION_ID"]
link = "claude://claude.ai/epitaxy/{id}"

[verbs.start]
when = "берёшь задачу в работу"
comment = """
Взял в работу. Сессия: {session}

{comment}"""

[verbs.wait]
when = "работа встала: ждём другую задачу или внешнее решение"
comment = """
Ждём {by}.

{comment}"""

[verbs.ready]
when = "сделано, проверено и закоммичено в main"

[verbs.done]
when = "изменение вошло в релиз"
# Done только через Ready: release оставит задачи в работе (частичный
# коммит с Refs #N) как not ready, а не переведёт их.
from = ["Ready"]

# gh dojo agent install: skill для Claude Code из этого конфига плюс наши
# заметки (русский текст про процесс, «Чего нет в gh-dojo», версия).
[agent]
targets = ["claude"]
notes = ".github/dojo-notes.md"
description = "Also load it when you notice an inconvenience in gh-dojo itself: it becomes a dogfood issue right away."

# gh dojo release: мы коммитим в main без PR и пишем в коммите `Refs #N`,
# поэтому кроме закрывающих слов GitHub релиз ищет задачи и по `Refs`.
[release]
keywords = ["close", "closes", "closed", "fix", "fixes", "fixed", "resolve", "resolves", "resolved", "refs"]
