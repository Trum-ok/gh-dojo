# gh-dojo's process: issues are handled only through `gh dojo`.
# Ready: done, checked and committed to main; Done: shipped in a release
# (the preset's done also closes the issue as completed).

version = 1
preset = "kanban"

[board]
owner = "Trum-ok"
project = 5
repos = ["Trum-ok/gh-dojo"]

[labels]
types = ["bug", "enhancement", "documentation", "dogfood"]

[session]
env = ["CLAUDE_CODE_HOST_SESSION_ID"]
link = "claude://claude.ai/epitaxy/{id}"

[verbs.start]
when = "you take an issue to work on"
comment = """
Taken. Session: {session}

{comment}"""

[verbs.wait]
when = "work has stopped: waiting for another issue or an outside decision"
comment = """
Waiting for {by}.

{comment}"""

[verbs.ready]
when = "done, checked and committed to main"

[verbs.done]
when = "the change has shipped in a release"
# Done only from Ready: release leaves issues still in progress (a partial
# commit with Refs #N) as not ready instead of moving them.
from = ["Ready"]

[verbs.plan]
when = "the issue moves to another stage"
from = ["Backlog", "In progress", "Waiting", "Ready"]
milestone = "{milestone}"
batch = true

# gh dojo agent install: the Claude Code skill from this config plus our
# notes (the process, what gh-dojo lacks, which version runs).
[agent]
targets = ["claude"]
notes = ".github/dojo-notes.md"
description = "Also load it when you notice an inconvenience in gh-dojo itself: it becomes a dogfood issue right away."

# gh dojo release: we commit to main without pull requests and write `Refs #N`
# in commits, so besides GitHub's closing keywords release also looks for `Refs`.
[release]
keywords = ["close", "closes", "closed", "fix", "fixes", "fixed", "resolve", "resolves", "resolved", "refs"]
