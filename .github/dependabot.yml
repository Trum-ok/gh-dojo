version: 2
updates:
  - package-ecosystem: gomod
    # tools: the linters CI runs (tools/go.mod)
    directories: [/, /tools]
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
