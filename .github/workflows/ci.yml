name: CI

# Pushes to main and pull requests only, so a PR branch is not built twice.
# release.yml calls it on the tagged commit and releases only if it passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit on main
# keeps its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # OS-independent checks, run once.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # tools/ (staticcheck) has its own modules: a version bump there
          # must not reuse the old cache.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The Makefile's targets, so make check runs the same checks.
      - name: Format
        run: make fmt
      # go.mod and go.sum, of gh-dojo and of tools/.
      - name: Tidy
        run: make tidy
      # On Linux, Windows and macOS, and the e2e tests.
      - name: Vet
        run: make vet
      # staticcheck, pinned in tools/go.mod, on the same systems as vet.
      - name: Staticcheck
        run: make lint
      # The same script the release workflow runs, so a broken release build
      # shows up before a tag is pushed.
      - name: Release build
        run: |
          script/build-release.sh v0.0.0-ci
          dist/gh-dojo_v0.0.0-ci_linux-amd64 --version | grep -Fx "gh dojo version v0.0.0-ci"
          (cd dist && sha256sum -c --strict gh-dojo_v0.0.0-ci_checksums.txt)
          test "$(wc -l <dist/gh-dojo_v0.0.0-ci_checksums.txt)" -eq 6
      # The agent skill is generated from .github/dojo.toml by this branch's
      # build: a config or command change without `make agent` fails here.
      - name: Agent instructions
        run: dist/gh-dojo_v0.0.0-ci_linux-amd64 agent install --check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # On Ubuntu also with -race, failing on golden files no test reads.
          - os: ubuntu-latest
            test: script/unused-golden.sh -race
          - os: macos-latest
            test: go test ./...
          - os: windows-latest
            test: go test ./...
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test
        run: ${{ matrix.test }}
      - name: Build
        run: go build ./...
