name: CI

# Pushes to main and pull requests only, so a PR branch is not built twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # OS-independent checks, run once.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Tidy
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
          go vet -tags e2e ./e2e
      # staticcheck, pinned in tools/go.mod, on the same systems as vet.
      - name: Staticcheck
        run: make lint
      # The same script the release workflow runs, so a broken release build
      # shows up before a tag is pushed.
      - name: Release build
        run: |
          script/build-release.sh v0.0.0-ci
          dist/gh-dojo_v0.0.0-ci_linux-amd64 --version | grep -Fx "gh dojo version v0.0.0-ci"
          (cd dist && sha256sum -c --strict gh-dojo_v0.0.0-ci_checksums.txt)
          test "$(wc -l <dist/gh-dojo_v0.0.0-ci_checksums.txt)" -eq 6
      # The agent skill is generated from .github/dojo.toml by this branch's
      # build: a config or command change without `make agent` fails here.
      - name: Agent instructions
        run: dist/gh-dojo_v0.0.0-ci_linux-amd64 agent install --check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # On Ubuntu also with -race, failing on golden files no test reads.
          - os: ubuntu-latest
            test: script/unused-golden.sh -race
          - os: macos-latest
            test: go test ./...
          - os: windows-latest
            test: go test ./...
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: ${{ matrix.test }}
      - name: Build
        run: go build ./...
