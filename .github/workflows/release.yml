name: Release

# A pushed v* tag builds gh-dojo for darwin, linux and windows on amd64 and
# arm64 and publishes the binaries as a GitHub release, which is what
# `gh extension install Trum-ok/gh-dojo` downloads. A tag with a "-" (for
# example v0.1.0-rc.1) becomes a prerelease. The tag is stamped into
# `gh dojo --version` by script/build-release.sh, which also writes the
# SHA-256 sums of the binaries.
#
# Every asset gets a build provenance attestation: a Sigstore-signed
# statement that this workflow built it from this repository at the tagged
# commit. `gh attestation verify <file> --repo Trum-ok/gh-dojo` checks it
# (see CONTRIBUTING.md, Releases).
#
# The release notes are the Changelog lines of the commits since the
# previous tag (script/release-notes.sh): GitHub's generated notes list
# merged pull requests only, and most commits here go to main directly.
#
# The release is made as a draft with its assets, gets its notes, and is
# published last: releases are immutable, so once published its tag and
# assets can no longer change. A failed run leaves the draft; running it
# again uploads the assets to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  # The whole of CI (ci.yml) on the tagged commit, and the release only once
  # it passes: the same checks and tests on Linux, macOS and Windows as on
  # main, not a subset that could let a red commit through. They stay out of
  # the release job: gh-extension-precompile sets up Go with its own
  # actions/setup-go, which restores the module cache; after `go test` in the
  # same job the modules are already on disk, and tar logs "Cannot open: File
  # exists" for each of them.
  #
  # ci.yml's concurrency group is evaluated with this run's context, so it is
  # ci-refs/tags/<tag>: apart from this workflow's release-refs/tags/<tag>
  # (a called workflow in its caller's group deadlocks) and from main's CI,
  # and a push event does not cancel it. It gets this workflow's
  # contents: read, all it asks for.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # create the release and upload its assets
      id-token: write     # sign the attestations through Sigstore
      attestations: write # store them on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous tag and the commits since it, for the notes
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          go_version_file: go.mod
          build_script_override: script/build-release.sh
          generate_attestations: true
          draft_release: true
      - name: Release notes
        shell: bash # with pipefail: a failed script must not leave empty notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: script/release-notes.sh "$GITHUB_REF_NAME" | gh release edit "$GITHUB_REF_NAME" --notes-file -
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
