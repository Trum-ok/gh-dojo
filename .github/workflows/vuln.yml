name: govulncheck

# Known vulnerabilities in the code gh-dojo calls, its modules and the Go
# standard library it is built with. Daily as well as on changes: a new
# vulnerability is published while the code stays the same. govulncheck
# reports only what the code can reach; a vulnerable module whose affected
# functions are not called shows in the log but does not fail the run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go.mod's toolchain line is the exact Go release the release build
      # (gh-extension-precompile, with go_version_file: go.mod) uses too, so
      # the standard library checked here is the one shipped. No check-latest:
      # it would check a newer patch release than the one released. A fix in a
      # newer one shows as a finding; bump the toolchain line then.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # govulncheck is built from tools/go.mod (make vuln): a version bump
          # there must not reuse the old cache.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: govulncheck
        run: make vuln
