name: Idea
description: Something gh dojo should do, or do differently
labels: ["type: enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The process or the board, and where gh dojo gets in the way today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A command, a flag, a config key; or just the outcome you want
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your `.github/dojo.toml`, or the part of it that matters
      render: toml
