# .github/dojo.toml for a code review flow, written without a preset: every
# status and verb is defined here. An agent writes the change and opens a
# pull request; a person reviews it, and approving or rejecting the change is
# theirs to decide. Copy it to .github/dojo.toml, set [board], and rename
# statuses, labels and verbs to your team's.
# `gh dojo doctor` checks the result against the board.
#
# Board: a GitHub Projects v2 board whose Status field has the options
# Backlog, In progress, In review, Changes requested, Approved and Merged
# (other options are fine).
# Repository labels (gh label create needs-review):
#   - types, for new --type bug: kind/bug, kind/feature and the like;
#   - areas, for new --area billing: service:billing and the like;
#   - the verbs': blocked, needs-review, changes-requested.
# gh dojo doctor checks them: it prints a gh label create for each verb
# label missing, and warns when no type or no area exists (the prefixes are
# set here, not by a preset). The reviewer, named with review --assignee, must be able
# to be assigned issues in the repository.
#
# Reference: https://github.com/Trum-ok/gh-dojo/blob/main/docs/configuration.md

version = 1                  # no preset: nothing comes from kanban or sprints

[board]
owner = "acme"
project = 12
repos = ["acme/payments"]
assignee = "@me"             # assign = true: the agent's user, the change's author

[fields]
status = "Status"            # required without a preset

[statuses]
initial = "Backlog"          # new sets it; an issue off the board counts as Backlog
final = ["Merged"]           # list hides merged issues, with a counter
resolved = ["Merged"]        # a blocker blocks until merged: approved is not in main yet

[labels]
type_prefix = "kind/"        # new --type bug adds the label kind/bug
area_prefix = "service:"     # new --area billing adds the label service:billing

[session]
env = ["CLAUDE_CODE_HOST_SESSION_ID"]
link = "claude://claude.ai/epitaxy/{id}"

# The author's verbs. The author's agent runs every verb here, so "@me" (and
# board.assignee) is the author: run by the reviewer, request-changes and
# approve would keep the reviewer and unassign the author.

[verbs.start]
when = "You begin writing the change"
to = "In progress"
from = ["Backlog"]
blockers = "deny"            # refuse while a blocker is not merged or closed
assign = true                # board.assignee
comment = """
Started. Session: {session}

{comment}"""

# On hold is a label, not a status, so the issue keeps its status: hold
# adds the label and resume removes it (reject too, closing the issue).
# review, approve and merged refuse an issue on hold (exit code 2). hold
# and resume check no label, so a repeat of either finishes what a partly
# applied run left; on an issue not on hold, resume removes nothing.
# resume also runs in Approved: an approved issue labelled blocked by hand
# gets back to merged without being rejected.

[verbs.hold]
when = "Work is stuck: waiting for another issue or an outside decision"
from = ["In progress", "Changes requested"]   # no `to`: the status stays
labels = ["+blocked"]
blockers = "link"            # --by 17 also marks the issue blocked by #17
require_one_of = ["by", "comment"]
comment = """
On hold until {by}.

{comment}"""

[verbs.resume]
when = "What held the issue is resolved"
from = ["In progress", "Changes requested", "Approved"]
labels = ["-blocked"]
blockers = "deny"            # refuse while a blocker is still open
comment = "{comment}"

[verbs.review]
when = "The pull request is open and ready for review"
to = "In review"
from = ["In progress", "Changes requested"]
blockers = "deny"            # nothing goes to review on top of an unmerged change
require = ["comment"]        # the pull request
labels = ["+needs-review", "-changes-requested"]
refuse_labels = ["blocked"]  # not while on hold
assign = "{assignee}"        # the reviewer: review 24 --assignee octocat; added next to the author
comment = "Ready for review by @{assignee}: {comment}"

[verbs.request-changes]
when = "The reviewer asked for changes; the author makes them and runs review again"
to = "Changes requested"
from = ["In review"]
require = ["comment"]        # what to change, in the reviewer's words
labels = ["-needs-review", "+changes-requested"]
assign = true                # back to the author (board.assignee: @me, the
unassign = "all"             # author's agent runs it) alone, without the reviewer
comment = "Changes requested: {comment}"

# The user's decisions: exit code 2 until the agent asks the person it works
# for and runs the verb again with --yes. gh-dojo does not check that the
# pull request was approved on GitHub.

[verbs.approve]
when = "The user approved the pull request after reviewing it"
to = "Approved"
from = ["In review"]
labels = ["-needs-review"]
refuse_labels = ["blocked"]
assign = true                # the author merges it...
unassign = "all"             # ...and the reviewer is done
confirm = "user"
comment = """
Approved.

{comment}"""

[verbs.reject]
when = "The user decided the change is not wanted"
from = ["In progress", "In review", "Changes requested", "Approved"]   # a merged issue is refused, whatever its status
close = "not_planned"        # the status stays: closed issues leave list anyway
labels = ["-needs-review", "-changes-requested", "-blocked"]
require = ["comment"]        # the reason; with no template, --comment is the comment
confirm = "user"

# After the merge. The verb records it; it does not merge the pull request.

[verbs.merged]
when = "The approved pull request has been merged into main"
to = "Merged"
from = ["Approved"]
close = "completed"          # an issue the pull request closed stays closed
refuse_labels = ["blocked"]
comment = "{comment}"
